const SAMPLES = [
  {label: "Pass-likely (spyne-media)", url: "https://spyne-media.s3.amazonaws.com/2026-04-30/car_replace_bg_1dc321cf-4ccd-4723-9c7e-4abac8354c20.png"},
  {label: "Fail-likely (desktop-app)", url: "https://spyne-desktop-app.s3.amazonaws.com/8e01fd835/abc/1777606480549/desktop_editor/d/img-c7f864ac.jpeg"},
  {label: "Unknown domain", url: "https://example-cdn.com/some-image.jpg"},
];

function parseUrl(u) {
  try {
    const url = new URL(u);
    const segs = url.pathname.replace(/^\/+|\/+$/g, '').split('/');
    const extMatch = url.pathname.match(/\.([a-zA-Z0-9]+)$/);
    const ext = extMatch ? extMatch[1].toLowerCase() : '';
    return {
      ok: true,
      domain: url.hostname,
      urlEntId: segs[0] || '',
      hasCarReplaceBg: u.includes('car_replace_bg'),
      ext: ext,
    };
  } catch (e) {
    return { ok: false };
  }
}

function logOdds(p) {
  const eps = 1e-6;
  return Math.log((p + eps) / (1 - p + eps));
}
function sigmoid(x) {
  return 1 / (1 + Math.exp(-x));
}

function predictFromFeatures(f, category, enterprise) {
  const factors = [];
  const rates = [];
  const weights = [];

  // Domain
  if (f.domain && MODEL.domain[f.domain] !== undefined) {
    const r = MODEL.domain[f.domain];
    const n = MODEL.domain_counts[f.domain];
    factors.push({key: 'Domain', val: f.domain, rate: r, n: n});
    rates.push(r); weights.push(3.0);
  } else if (f.domain) {
    factors.push({key: 'Domain', val: f.domain + ' (not in data)', rate: MODEL.base_rate, n: 0});
    rates.push(MODEL.base_rate); weights.push(0.5);
  }

  // URL enterprise id (path[0])
  if (f.urlEntId && MODEL.url_ent_id[f.urlEntId] !== undefined) {
    const r = MODEL.url_ent_id[f.urlEntId];
    const n = MODEL.url_ent_counts[f.urlEntId];
    factors.push({key: 'URL path id', val: f.urlEntId, rate: r, n: n});
    rates.push(r); weights.push(2.5);
  }

  // car_replace_bg pattern
  const crbR = f.hasCarReplaceBg ? MODEL.crb_with : MODEL.crb_without;
  factors.push({key: 'car_replace_bg', val: f.hasCarReplaceBg ? 'present' : 'absent', rate: crbR, n: null});
  rates.push(crbR); weights.push(1.0);

  // Extension
  if (f.ext && MODEL.ext[f.ext] !== undefined) {
    const r = MODEL.ext[f.ext];
    factors.push({key: 'Extension', val: '.' + f.ext, rate: r, n: null});
    rates.push(r); weights.push(0.5);
  }

  // Category (user-provided)
  if (category && MODEL.category[category] !== undefined) {
    const r = MODEL.category[category];
    factors.push({key: 'Category', val: category, rate: r, n: null});
    rates.push(r); weights.push(1.5);
  }

  // Enterprise (user-provided)
  if (enterprise && MODEL.enterprise[enterprise] !== undefined) {
    const r = MODEL.enterprise[enterprise];
    factors.push({key: 'Enterprise', val: enterprise, rate: r, n: null});
    rates.push(r); weights.push(2.0);
  }

  // Weighted log-odds average
  let probFail;
  if (rates.length === 0) {
    probFail = MODEL.base_rate;
  } else {
    let num = 0, den = 0;
    for (let i = 0; i < rates.length; i++) {
      num += logOdds(rates[i]) * weights[i];
      den += weights[i];
    }
    probFail = sigmoid(num / den);
  }
  return { probFail, factors };
}

function rateClass(r) {
  if (r < 0.02) return 'lo';
  if (r > 0.15) return 'hi';
  return 'mid';
}

function renderResult(probFail, factors, hasKnownDomain) {
  const pct = (probFail * 100);
  let verdict, badgeClass;
  if (!hasKnownDomain) {
    verdict = 'Unknown';
    badgeClass = 'unknown';
  } else if (probFail >= 0.15) {
    verdict = 'Likely Fail';
    badgeClass = 'fail';
  } else if (probFail >= 0.03) {
    verdict = 'Borderline';
    badgeClass = 'unknown';
  } else {
    verdict = 'Likely Pass';
    badgeClass = 'pass';
  }

  const passPct = (100 - pct);
  const barClass = badgeClass;
  const barWidth = badgeClass === 'pass' ? passPct : (badgeClass === 'fail' ? pct : 50);

  const factorsHtml = factors.map(f => {
    const cls = rateClass(f.rate);
    const nLabel = f.n != null ? ' (n=' + f.n.toLocaleString() + ')' : '';
    return '<div class="qc-factor"><div class="qc-factor-key">' + f.key + '</div>' +
      '<div class="qc-factor-val" title="' + escapeHtml(f.val + nLabel) + '">' + escapeHtml(f.val) + nLabel + '</div>' +
      '<div class="qc-factor-rate ' + cls + '">' + (f.rate * 100).toFixed(2) + '% fail</div></div>';
  }).join('');

  const html =
    '<div class="qc-verdict">' +
      '<span class="qc-badge ' + badgeClass + '">' + verdict + '</span>' +
      '<div style="margin-left:auto; text-align:right;">' +
        '<div class="qc-conf">' + passPct.toFixed(1) + '%</div>' +
        '<div class="qc-conf-label">predicted pass confidence</div>' +
      '</div>' +
    '</div>' +
    '<div class="qc-bar"><div class="qc-bar-fill ' + barClass + '" style="width:' + barWidth.toFixed(1) + '%"></div></div>' +
    '<div class="qc-factors"><h3>Factors used</h3>' + factorsHtml + '</div>';

  const el = document.getElementById('qc-result');
  el.className = 'qc-result';
  el.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function qcPredict() {
  const url = document.getElementById('qc-url').value.trim();
  const category = document.getElementById('qc-category').value;
  const enterprise = document.getElementById('qc-enterprise').value;
  if (!url) {
    document.getElementById('qc-result').className = 'qc-result empty';
    document.getElementById('qc-result').textContent = 'Paste a URL above and hit Predict.';
    return;
  }
  const f = parseUrl(url);
  if (!f.ok) {
    document.getElementById('qc-result').className = 'qc-result empty';
    document.getElementById('qc-result').textContent = 'Could not parse that URL — make sure it starts with http(s)://';
    return;
  }
  const hasKnownDomain = MODEL.domain[f.domain] !== undefined;
  const { probFail, factors } = predictFromFeatures(f, category, enterprise);
  renderResult(probFail, factors, hasKnownDomain);
}

function init() {
  // Populate selects
  const catSel = document.getElementById('qc-category');
  Object.keys(MODEL.category).sort().forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = k; catSel.appendChild(o);
  });
  const entSel = document.getElementById('qc-enterprise');
  // Show enterprises by sample count desc, top 100
  const ents = Object.keys(MODEL.enterprise).map(k => [k, MODEL.enterprise_counts[k] || 0]);
  ents.sort((a,b) => b[1] - a[1]);
  ents.slice(0, 200).forEach(([k, n]) => {
    const o = document.createElement('option'); o.value = k; o.textContent = k + ' (n=' + n.toLocaleString() + ')'; entSel.appendChild(o);
  });

  // Samples
  const sEl = document.getElementById('qc-samples');
  SAMPLES.forEach(s => {
    const b = document.createElement('span');
    b.className = 'qc-sample';
    b.textContent = s.label;
    b.onclick = () => { document.getElementById('qc-url').value = s.url; qcPredict(); };
    sEl.appendChild(b);
  });

  // Model meta
  document.getElementById('qc-model-meta').textContent =
    'Trained on ' + MODEL.total_records.toLocaleString() + ' images · base fail rate ' + (MODEL.base_rate*100).toFixed(2) + '%';

  // Footer
  document.getElementById('qc-foot').innerHTML =
    'Predictions are based on historical pass/fail patterns by URL domain, path segments, ' +
    'filename patterns, and (optional) category/enterprise. ' +
    'Held-out validation: <strong style="font-weight:500;">AUC 0.994</strong>; ' +
    'at threshold 5% the model catches 90% of fails with 60% precision. ' +
    'URLs whose domain or enterprise are not in the historical data fall back to the base rate ' +
    'and are marked Unknown.';

  // Allow enter-key submit
  document.getElementById('qc-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') qcPredict();
  });
}
init();
</script>
